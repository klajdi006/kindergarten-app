<ion-tabs>
  <ion-tab-bar slot="bottom" [class.tab-bar-hide-mobile]="inConversation()">
    <ion-tab-button tab="posts" href="/parent/posts">
      <ion-icon aria-hidden="true" name="newspaper-outline"></ion-icon>
      <ion-label>{{ 'parent.tabs.posts' | translate }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="children" href="/parent/children">
      <ion-icon aria-hidden="true" name="people-outline"></ion-icon>
      <ion-label>{{ 'parent.tabs.children' | translate }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="messages" href="/parent/messages">
      <ion-icon aria-hidden="true" name="chatbubbles-outline"></ion-icon>
      <ion-label>{{ 'messages.title' | translate }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="settings" href="/parent/settings">
      <ion-icon aria-hidden="true" name="settings-outline"></ion-icon>
      <ion-label>{{ 'parent.tabs.settings' | translate }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
