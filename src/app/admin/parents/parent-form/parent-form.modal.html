<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()" [attr.aria-label]="'common.cancel' | translate">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ 'admin.parents.add' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button strong="true" (click)="save()">{{ 'common.save' | translate }}</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <form [formGroup]="form" (ngSubmit)="save()">
    <ion-list inset="true">
      <ion-item>
        <ion-input
          [label]="'admin.parents.fields.firstName' | translate"
          labelPlacement="floating"
          formControlName="firstName">
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          [label]="'admin.parents.fields.lastName' | translate"
          labelPlacement="floating"
          formControlName="lastName">
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          type="email"
          autocomplete="email"
          [label]="'admin.parents.fields.email' | translate"
          labelPlacement="floating"
          formControlName="email">
        </ion-input>
      </ion-item>
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <ion-note color="danger" class="ion-padding-start">
          {{ 'login.validation.invalidEmail' | translate }}
        </ion-note>
      }
      <ion-item lines="none">
        <ion-input
          type="tel"
          inputmode="tel"
          [label]="'admin.parents.fields.phone' | translate"
          labelPlacement="floating"
          formControlName="phone">
        </ion-input>
      </ion-item>
    </ion-list>
    <ion-text color="medium">
      <p class="ion-padding-horizontal"><small>{{ 'admin.parents.inviteHint' | translate }}</small></p>
    </ion-text>
  </form>
</ion-content>
