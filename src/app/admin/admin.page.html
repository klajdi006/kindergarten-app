<ion-tabs>
  <ion-tab-bar slot="bottom" [class.tab-bar-hide-mobile]="inConversation()">
    <ion-tab-button tab="home" href="/admin/home">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
      <ion-label>{{ 'admin.tabs.home' | translate }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="people" href="/admin/people">
      <ion-icon aria-hidden="true" name="people-outline"></ion-icon>
      <ion-label>{{ 'admin.tabs.people' | translate }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="content" href="/admin/content">
      <ion-icon aria-hidden="true" name="documents-outline"></ion-icon>
      <ion-label>{{ 'admin.tabs.content' | translate }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="messages" href="/admin/messages">
      <ion-icon aria-hidden="true" name="chatbubbles-outline"></ion-icon>
      <ion-label>{{ 'messages.title' | translate }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="settings" href="/admin/settings">
      <ion-icon aria-hidden="true" name="settings-outline"></ion-icon>
      <ion-label>{{ 'admin.tabs.settings' | translate }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
