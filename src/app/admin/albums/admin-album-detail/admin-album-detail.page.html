<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="listUrl()"></ion-back-button>
    </ion-buttons>
    <ion-title>
      @if (album(); as a) {
        {{ a.name }}
      } @else {
        {{ 'admin.albums.title' | translate }}
      }
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div
    class="ion-text-center"
    style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.75rem;padding-top:3rem;">
    <ion-icon
      [icon]="imagesOutline"
      style="font-size:3rem;color:var(--ion-color-medium);"
      aria-hidden="true">
    </ion-icon>
    <ion-text color="medium">
      <p>{{ 'admin.albums.photosDisabled' | translate }}</p>
    </ion-text>
  </div>
</ion-content>
