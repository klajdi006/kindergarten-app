<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>{{ 'admin.content.title' | translate }}</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment [value]="segment()" (ionChange)="onSegmentChange($any($event))">
      <ion-segment-button value="posts">
        <ion-label>{{ 'admin.tabs.posts' | translate }}</ion-label>
      </ion-segment-button>
      <ion-segment-button value="albums">
        <ion-label>{{ 'admin.tabs.albums' | translate }}</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<router-outlet></router-outlet>
