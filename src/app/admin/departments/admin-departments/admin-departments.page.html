<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($any($event))">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @if (loading()) {
    <app-skeleton-list [count]="5" [avatar]="false" />
  } @else if (departments.all().length === 0) {
    <div class="ion-padding ion-text-center">
      <ion-text color="medium">
        <p>{{ 'admin.departments.empty' | translate }}</p>
      </ion-text>
    </div>
  } @else {
    <ion-list>
      @for (dept of departments.all(); track dept.id) {
        <ion-item-sliding>
          <ion-item button="true" (click)="openEdit(dept)">
            <ion-label>
              <h2>{{ dept.name }}</h2>
              <p>
                {{ 'admin.departments.ageRange' | translate: { min: dept.ageMin, max: dept.ageMax } }}
              </p>
            </ion-label>
          </ion-item>
          <ion-item-options side="end">
            <ion-item-option color="primary" (click)="openEdit(dept)">
              <ion-icon slot="icon-only" name="create-outline"></ion-icon>
            </ion-item-option>
            <ion-item-option color="danger" (click)="confirmDelete(dept)">
              <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      }
    </ion-list>
  }

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="openCreate()" [attr.aria-label]="'common.add' | translate">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
