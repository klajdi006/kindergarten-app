<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/employee/albums"></ion-back-button>
    </ion-buttons>
    <ion-title>
      @if (album(); as a) {
        {{ a.name }}
      } @else {
        {{ 'admin.albums.title' | translate }}
      }
    </ion-title>
  </ion-toolbar>
  @if (uploading()) {
    <ion-progress-bar [value]="uploadProgress()"></ion-progress-bar>
  }
</ion-header>

<ion-content [fullscreen]="true">
  @if (photos().length === 0) {
    <div
      class="ion-text-center"
      style="display:flex;flex-direction:column;align-items:center;gap:0.75rem;padding-top:3rem;">
      <ion-icon
        [icon]="imagesOutline"
        style="font-size:3rem;color:var(--ion-color-medium);"
        aria-hidden="true">
      </ion-icon>
      <ion-text color="medium">
        <p>{{ 'admin.albums.noPhotos' | translate }}</p>
      </ion-text>
    </div>
  } @else {
    <div class="photo-grid">
      @for (photo of photos(); track photo.id; let i = $index) {
        <div class="photo-grid-cell" (click)="openViewer(i)">
          <img [src]="photo.downloadUrl" loading="lazy" alt="" />
          @if (canEdit()) {
            <button
              class="photo-grid-delete"
              type="button"
              (click)="confirmDeletePhoto(photo, $event)"
              [attr.aria-label]="'common.delete' | translate">
              <ion-icon name="close-outline"></ion-icon>
            </button>
          }
        </div>
      }
    </div>
  }

  @if (canEdit()) {
    <input
      type="file"
      accept="image/*"
      multiple
      hidden
      #fileInput
      (change)="onFilesPicked($event)" />

    <ion-fab slot="fixed" vertical="bottom" horizontal="end">
      <ion-fab-button
        [disabled]="uploading()"
        (click)="fileInput.click()"
        [attr.aria-label]="'admin.albums.upload' | translate">
        <ion-icon name="cloud-upload-outline"></ion-icon>
      </ion-fab-button>
    </ion-fab>
  }
</ion-content>
