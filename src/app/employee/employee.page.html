<ion-tabs>
  <ion-tab-bar slot="bottom" [class.tab-bar-hide-mobile]="inConversation()">
    <ion-tab-button tab="home" href="/employee/home">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
      <ion-label>{{ 'employee.tabs.home' | translate }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="posts" href="/employee/posts">
      <ion-icon aria-hidden="true" name="newspaper-outline"></ion-icon>
      <ion-label>{{ 'employee.tabs.posts' | translate }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="messages" href="/employee/messages">
      <ion-icon aria-hidden="true" name="chatbubbles-outline"></ion-icon>
      <ion-label>{{ 'messages.title' | translate }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="settings" href="/employee/settings">
      <ion-icon aria-hidden="true" name="settings-outline"></ion-icon>
      <ion-label>{{ 'employee.tabs.settings' | translate }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
