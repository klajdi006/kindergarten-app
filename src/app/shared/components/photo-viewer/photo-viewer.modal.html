<ion-header [translucent]="true">
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-button (click)="close()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ currentIndex() + 1 }} / {{ photos.length }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" [scrollY]="false" class="photo-viewer-content">
  <swiper-container
    class="photo-viewer-swiper"
    zoom="true"
    (swiperafterinit)="onInit($event)"
    (swiperslidechange)="onSlideChange($event)">
    @for (photo of photos; track photo.id) {
      <swiper-slide>
        <div class="swiper-zoom-container">
          <img [src]="photo.downloadUrl" loading="lazy" alt="" />
        </div>
      </swiper-slide>
    }
  </swiper-container>
</ion-content>
