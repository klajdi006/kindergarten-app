@if (showImages()) {
  @if (images().length === 1) {
    <div class="post-image-frame" (click)="openImage(0, $event)">
      <img [src]="images()[0]" loading="lazy" alt="" />
    </div>
  } @else {
    <swiper-container class="post-image-frame post-image-swiper" pagination="true">
      @for (url of images(); track url; let i = $index) {
        <swiper-slide (click)="openImage(i, $event)">
          <img [src]="url" loading="lazy" alt="" />
        </swiper-slide>
      }
    </swiper-container>
  }
}

@if (showFiles()) {
  <div class="post-file-links">
    @for (att of attachments(); track att.path) {
      <a
        class="post-file-link"
        [href]="att.url"
        target="_blank"
        rel="noopener"
        (click)="$event.stopPropagation()">
        <ion-icon name="attach-outline" aria-hidden="true"></ion-icon>
        <span>{{ att.name }}</span>
      </a>
    }
  </div>
}
